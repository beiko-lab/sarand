name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag to publish"
        required: true
        default: "v2.0.3"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/sarand/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Select release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
      - name: Verify version matches release tag
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_REF"]
          expected = tag.removeprefix("v")

          init_file = Path("sarand/__init__.py")
          text = init_file.read_text(encoding="utf-8")

          match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              text,
              re.MULTILINE,
          )

          if not match:
              raise SystemExit(
                  f"Could not find __version__ in {init_file}"
              )

          actual = match.group(1)

          if actual != expected:
              raise SystemExit(
                  f"Version mismatch: release tag is {tag}, "
                  f"but sarand.__version__ is {actual}"
              )

          print(f"Version verified: tag {tag} matches sarand {actual}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Validate package
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
